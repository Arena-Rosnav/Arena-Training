# Contextual Social RSSM (cSRSSM) — proposed SOTA config.
#
# Casts social nav as a contextual MDP: a slow, probabilistic crowd-behavior code b (inferred
# once per sequence from a ground-truth ped window, held fixed across the imagination horizon)
# conditions the RSSM *transition* directly (img_step), not just the actor/critic feature. This
# is the social analogue of DALI's dynamics-aligned latent imagination (friction/gravity context)
# and enables counterfactual social rollouts. Graph encoder upgraded to HEIGHT (genuinely
# separate per-edge-type multi-head attention, incl. a new ped→robot edge type) in place of the
# GAT shared-Q soft-blend. DALI (d_t-in-feature) is superseded by context.py and disabled here.
#
# Ablation trio:
#   social_gat_feat_config          : today's feature-only social baseline (reference)
#   social_csrssm_config             <- this file: contextual RSSM + HEIGHT (proposed)
#   social_csrssm_no_context_config  : HEIGHT graph, context OFF -- isolates the b-in-transition gain
#
# Headline result = this file vs. social_gat_feat_config; social_csrssm_no_context_config proves
# the gain (if any) comes from conditioning the transition, not just from the HEIGHT graph swap.

agent_config:
  name: social_csrssm
  observations_config: observations/observations.yaml

  framework:
    name: dreamerv3

    general:
      logdir: null
      device: cuda:0

    model:
      units: 512
      act: SiLU
      norm: true

      dyn_stoch: 32
      dyn_deter: 1024
      dyn_hidden: 512
      dyn_rec_depth: 1
      dyn_discrete: 32
      dyn_mean_act: none
      dyn_std_act: sigmoid2
      dyn_min_std: 0.1
      dyn_scale: 0.5

      encoder:
        act: SiLU
        cnn_depth: 32
        cnn_keys: LaserCartesianMapSpace
        is_channels_first: true
        kernel_size: 4
        minres: 5
        # PedestrianNodeSetSpace added for Social-Dreamer ped encoding
        mlp_keys: DistAngleToGoalSpace|PedestrianNodeSetSpace
        mlp_layers: 5
        mlp_units: 1024
        norm: true
        symlog_inputs: true

      decoder:
        act: SiLU
        cnn_depth: 32
        cnn_keys: LaserCartesianMapSpace
        cnn_sigmoid: false
        image_dist: mse
        is_channels_first: true
        kernel_size: 4
        minres: 5
        # PedestrianNodeSetSpace is reconstructed by a dedicated head in WorldModel;
        # it does NOT appear here (that head consumes base_feat, not aug_feat).
        mlp_keys: DistAngleToGoalSpace
        mlp_layers: 5
        mlp_units: 1024
        norm: true
        outscale: 1.0
        vector_dist: symlog_mse

      behavior:
        discount: 0.997
        discount_lambda: 0.95
        imag_horizon: 15
        imag_gradient: dynamics
        imag_gradient_mix: 0.0
        eval_state_mean: false

      actor:
        dist: normal
        layers: 2
        units: 128
        lr: 3.0e-05
        entropy: 0.0003
        grad_clip: 100.0
        outscale: 1.0
        std: learned
        min_std: 0.1
        max_std: 1.0
        temp: 0.1
        unimix_ratio: 0.01
        eps: 1.0e-05

      critic:
        dist: symlog_disc
        layers: 2
        units: 128
        lr: 3.0e-05
        grad_clip: 100.0
        outscale: 0.0
        eps: 1.0e-05
        slow_target: true
        slow_target_update: 1
        slow_target_fraction: 0.02

      kl_free: 1.0
      rep_scale: 0.1

      reward_head:
        dist: symlog_disc
        layers: 2
        outscale: 0.0
        loss_scale: 1.0

      cont_head:
        layers: 2
        outscale: 1.0
        loss_scale: 1.0

      exploration:
        extr_scale: 0.0
        intr_scale: 1.0
        behavior: greedy
        until: 0
        disag_action_cond: false
        disag_target: stoch
        disag_log: true
        disag_models: 10
        disag_offset: 1
        disag_layers: 4
        disag_units: 400

      grad_heads:
      - decoder
      - reward
      - cont

      initial: learned
      unimix_ratio: 0.01
      weight_decay: 0.0

      # ── Social-Dreamer (M0 config block) ─────────────────────────────────────
      social:
        enabled: true
        max_peds: 8
        node_feat_dim: 5          # [rel_x, rel_y, vel_x, vel_y, social_state]
        peds_recon_scale: 1.0
        cell_type: gru            # "gru" (default), "transformer" (M5.1 attention-in-a-scan), "tssm" (M5.2 parallel observe)
        transformer_ctx_len: 64   # sliding-window length for TransformerCell
        transformer_num_heads: 4  # attention heads in TransformerCell

        use_se2_frame_canon: true   # SE(2) frame canonicalization (M5.2)
        kinematics_dt: 0.1          # 10 Hz control rate
        se2_augment_prob: 0.5       # random global SE(2) augmentation probability

        gat:
          enabled: true
          variant: height           # HEIGHT: genuinely separate per-edge-type MHA (RH/HH/OA)
          out_dim: 64
          heads: 4
          hidden: 128
          layers: 2
          radius_m: 4.0
          converge_angle_deg: 90.0

        dali:
          enabled: false           # superseded by context.py's repurposed trajectory GRU

        context:
          enabled: true            # cSRSSM: b conditions the RSSM transition (img_step)
          b_dim: 16
          hidden: 64
          window: 16               # trajectory-window length k for q(b|window)
          kl_scale: 1.0
          pred_scale: 0.1         # primary identifiability: predict next pooled crowd summary beyond window
          infonce_scale: 0.0      # secondary/ablation-only (false negatives under DR)

        curriculum:
          enabled: true
          # S0: WM warmup — gate: ped recon MSE ≤ 0.10 m² AND cross-sim probe ≥ 0.70
          warmup_steps: 500000
          recon_mse_gate: 0.10
          probe_acc_gate: 0.70
          # S1: GAT online — gate: success ≥ baseline AND c_t ablation drops ≥ 3 pp
          gat_steps: 1000000
          success_gate: 0.0           # overwrite at launch from baseline checkpoint
          ct_ablation_drop_gate: 0.03
          # S2: DALI online — gate: collision rate ≤ S1 (ratio ≤ 1.0)
          dali_steps: 1000000
          collision_gate: 1.0
          # S3: pedestrian-density ramp via staged task module
          density_steps: 2500000

    training:
      steps: 5.0e+6
      batch_size: 16
      batch_length: 64      # >= context.window=16 for the b-window slice
      train_ratio: 16
      dataset_size: 500000
      prefill_steps: 5000
      pretrain_steps: 100
      model_lr: 0.0001
      opt: adam
      opt_eps: 1.0e-08
      grad_clip: 1000
      eval_episode_num: 20
      eval_every: 1.0e+4

  reward:
    # TGRF-style composite (Kim et al. 2024, Sensors 24(14):4540, arXiv:2402.14569) minus
    # r_pred (their trajectory-prediction penalty needs a GST predictor; our world model
    # does prediction implicitly, so we omit it). goal/collision/approach_goal follow
    # their 10/-10/1.5 ratios; tgrf_discomfort uses their reported w_disc/sigma_disc/d_disc.
    # proxemic_intrusion/social_potential dropped here to avoid double-counting discomfort
    # (units remain in the codebase for ablations). RewardEMA percentile-normalizes
    # imagined returns, so only reward-term *ratios* matter, not absolute magnitudes.
    # Per-type pairs (ped_type_collision) encode a fixed child=2x adult severity ratio.
    # Tune anchors, keep ratios.
    reward_function_dict:
      goal_reached:
        reward: 10

      factored_safe_distance:
        factor: -0.2

      collision:
        reward: -10

      approach_goal:
        _potential_based: true
        factor: 0.15  # TGRF progress:goal ratio (1.5:10)
        gamma: 0.997
        _goal_update_threshold: 0.25
        _follow_subgoal: true
        _on_safe_dist_violation: true

      factored_reverse_drive:
        factor: 0.05
        threshold: 0.0
        _on_safe_dist_violation: true

      two_factor_velocity_difference:
        alpha: 0.005
        beta: 0.0
        _on_safe_dist_violation: true

      ped_type_collision:
        type_reward_pairs:
          0: -2.5
          1: -5

      angular_vel_constraint:
        penalty_factor: -0.01
        threshold: 0.5

      tgrf_discomfort:
        weight: 0.25
        sigma: 0.2
        danger_zone_m: 0.5

arena_cfg:
  general:
    debug_mode: false
    goal_radius: 0.4
    max_num_moves_per_eps: 1200
    n_envs: 4
    no_gpu: false
    safety_distance: 1.0
    control_hz: 10.0
    verbose: 1
  logging:
    default_level: CRITICAL
    overrides:
      rosnav_rl.observations: CRITICAL
      rosnav_rl.model.dreamerv3.helper: INFO
  monitoring:
    episode_logging:
      last_n_episodes: 20
      record_actions: true
      eval_metrics: false
      training_metrics: true
    wandb:
      project_name: Arena-RL
      group: Social-cSRSSM
      run_name: null
      tags: null
  task:
    tm_modules: staged
    tm_obstacles: random
    tm_robots: random
    staged:
      starting_stage: 0
      threshold_type: succ
      upper_threshold: 0.95
      lower_threshold: 0.3
      parameter_node_template: /arena/env_{i}/task_generator_node
      timeout: 5.0
      curriculum_definition:
        # Stage 0: empty world -- matches S0 WM-warmup (no crowd to confound recon-loss gate)
        - task.random.static.n: [0, 0]
          task.random.interactive.n: [0, 0]
          task.random.dynamic.n: [0, 0]
          task.random.static.models: []
          task.random.interactive.models: []
          task.random.dynamic.models: []
          goal_tolerance_radius: 1.5
        # Stage 1: first pedestrians -- roughly matches S1 GAT-online
        - task.random.static.n: [2, 4]
          task.random.interactive.n: [0, 0]
          task.random.dynamic.n: [1, 3]
          task.random.static.models: []
          task.random.interactive.models: []
          task.random.dynamic.models: []
          goal_tolerance_radius: 1.2
        # Stage 2: moderate crowd + doorways -- roughly matches S2 DALI-online
        - task.random.static.n: [3, 5]
          task.random.interactive.n: [0, 1]
          task.random.dynamic.n: [3, 6]
          task.random.static.models: []
          task.random.interactive.models: []
          task.random.dynamic.models: []
          goal_tolerance_radius: 1.0
        # Stage 3: dense crowd near social.max_peds=8 cap -- roughly matches S3 density ramp
        - task.random.static.n: [4, 6]
          task.random.interactive.n: [1, 2]
          task.random.dynamic.n: [6, 8]
          task.random.static.models: []
          task.random.interactive.models: []
          task.random.dynamic.models: []
          goal_tolerance_radius: 0.8
